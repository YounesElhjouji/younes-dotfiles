set-option -g default-shell /usr/bin/zsh

# --- Status line ---
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Colors — whole bar is reversed so VM is visually distinct from laptop
set -g status-style "reverse"

# Left: session name
set -g status-left-length 30
set -g status-left " [#S] "

# Right: date and time
set -g status-right-length 40
set -g status-right " %a %d %b  %H:%M "

# Windows
set -g window-status-format " #I #W "
set -g window-status-current-format "#[noreverse,bold] #I #W #[reverse,nobold]"
set -g window-status-separator ""

# No bells, no visual noise
set -g monitor-activity off
set -g visual-activity off
