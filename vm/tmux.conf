set-option -g default-shell /usr/bin/zsh

# --- Key bindings ---
# Prefix is Ctrl-f; Ctrl-f Ctrl-f sends a literal Ctrl-f to the pane.
unbind-key C-b
set-option -g prefix C-f
bind-key C-f send-prefix

# Clear stale bindings from older versions of this config.
unbind-key H
bind-key L switch-client -l

# Push the current window left/right one slot, preserving the order of others.
bind-key -r < if -F '#{window_start_flag}' '' 'swap-window -t -1; select-window -t -1'
bind-key -r > if -F '#{window_end_flag}' '' 'swap-window -t +1; select-window -t +1'

# --- Status line ---
# Keep a blank spacer row between full-screen apps and the tmux bar.
set -g status 2
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g 'status-format[0]' '#[bg=default,fg=default,noreverse]#{R: ,#{client_width}}'
set -g 'status-format[1]' '#[align=left range=left]#{T:status-left}#[norange default]#[list=on align=#{status-justify}]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange],#[range=window|#{window_index} list=focus]#{E:window-status-current-format}#[norange]}#[nolist align=right range=right]#{T:status-right}#[norange default]'

# Colors — whole bar is reversed so VM is visually distinct from laptop
set -g status-style "reverse"

# Left: session name
set -g status-left-length 30
set -g status-left " [#S] "

# Right: date and time
set -g status-right-length 40
set -g status-right " %a %d %b  %H:%M "

# Windows
set -g window-status-format " #I #W "
set -g window-status-current-format "#[noreverse,bold] #I #W #[reverse,nobold]"
set -g window-status-separator ""

# No bells, no visual noise
set -g monitor-activity off
set -g visual-activity off

# Enable mouse-wheel scrollback in tmux, including sessions reached over SSH.
set -g mouse on
